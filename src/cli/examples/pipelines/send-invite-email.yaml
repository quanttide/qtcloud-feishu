# 招聘流程定义
#
# 流程是数据，不是代码：改流程 = 改这份文件，执行器读它跑。
# 每个迁移标两件事：触发（什么事件让它发生）与执行者（人 / 系统 / 半自动）。
# 「人」是当前实情，不是应有形态——流程升级的方向就是把执行者从人换成系统。
#
# 检查：只有「执行者：系统」的迁移需要写检查——那是一段机器可判的条件，
# 成立才推。执行者是人或半自动的，执行器不代劳，只把它记成待办。
# 动作：迁移要真做的事（调一个能力），推过去之前先执行，失败就不挪格。
#      动作可以用「先取」在自己之前多取几样东西（如群邀请链接）：每样按「能力」调一次，
#      取到的值按 as 起名，参数模板里用 {{名字}} 引用。
#      不写动作的迁移照旧只挪格（副作用那句话仍留给人读）。
#
# 依据：qtrecurit-private/docs/handbook/workflow.md（2026-08 按实际运行更新）
# 2026-10 简化：投递后直接发群二维码，问卷不再作为进群前置（「问卷已交」格移除）；
#              问卷调研改到入群后由系统发出，超时机制改为盯二维码。

流程: 招聘
来源: 飞书
版本: 0.1.0

# ── 对接范围：拉哪些地方 ────────────────────────────────────────
# 卡点：HR 处理邮件时会把邮件移进「沟通面试中」等文件夹，
#      只拉收件箱会漏投递；有效投递还可能被 Spam 误判（且 Spam 里的附件下载受限）。
收集:
  邮箱: hr@quanttide.com
  范围:
    - 收件箱
    - 沟通面试中
    - Spam          # 需先移回收件箱再取附件
  对象:
    - 邮件（含附件）  # 投递的简历挂在邮件上
    - 群成员         # 实训基地群
  游标: 按文件夹各存一个，增量拉取

# ── 状态 ───────────────────────────────────────────────────────
状态:
  - 投递            # 候选人出现在收件箱
  - 二维码已发       # 群二维码邮件已发出，等扫码
  - 无响应          # 二维码发出超过 N 天没进群（可被「已进群」追认）
  - 已进群
  - 问卷已发        # 入群后发送问卷调研
  - 已建清单        # candidates.csv / documents.csv 生成
  - 已评估          # 评估报告完成
  - 推荐池
  - 已推荐
  - 推荐成功
  - 不推荐

# ── 迁移 ───────────────────────────────────────────────────────
迁移:
  - 从: 投递
    到: 二维码已发
    触发: 收到投递，直接发实训邀请
    执行者: 系统
    动作:
      能力: send_mail
      先取:
        - 能力: chat_link
          as: 邀请链接
      参数:
        to: "{{候选人.邮箱}}"
        subject: 量潮实训基地邀请
        body: |-
          {{候选人.姓名}}你好，感谢你对量潮科技的关注与投递。经评估，诚邀你加入量潮实训基地。

          实训基地是量潮科技对外招聘考核的组成部分。你将在这里通过完成真实的工作任务接受考核，以实际产出代替答卷。

          请加入实训基地群，进群后修改昵称为「{{候选人.姓名}}-岗位意向」：{{邀请链接}}

          具体考核规则将在群内发布，请关注群公告和资料。

          期待在基地见到你。

          量潮招聘
    副作用: 记发送时间

  - 从: 二维码已发
    到: 已进群
    触发: 群成员名单里出现该邮箱（扫码进群）
    执行者: 系统
    检查:
      能力: read_group_members
      成立: 包含该候选人邮箱
    副作用: 记进群时间

  - 从: 二维码已发
    到: 无响应
    触发: 二维码发出超过 N 天仍未进群
    执行者: 系统
    检查:
      能力: _since
      成立: 超过天数
      天数: 7            # N：说改就改，代码不动
    副作用: 记入待跟进清单

  - 从: 无响应
    到: 已进群
    触发: 迟到的扫码照样算
    执行者: 系统
    检查:
      能力: read_group_members
      成立: 包含该候选人邮箱
    副作用: 追认进群时间

  - 从: 已进群
    到: 问卷已发
    触发: 入群后发送问卷调研
    执行者: 系统
    动作:
      能力: send_mail
      参数:
        to: "{{候选人.邮箱}}"
        subject: 量潮招聘 · 准入问卷
        body: 请填写问卷：…
    副作用: 记发送时间

  - 从: 问卷已发
    到: 已建清单
    触发: 当月清单生成
    执行者: 半自动       # 系统生成，姓名/岗位/附件类型需人工核对
    副作用: 写 candidates.csv / documents.csv

  - 从: 已建清单
    到: 已评估
    触发: 评估报告完成
    执行者: 人           # 准则：了解度与留存优先
    副作用: 写 data/report/YYYY-MM-{candidates-ranking,survey}.md

  - 从: 已评估
    到: 推荐池
    触发: 命中准入底线（责任心 ≥ 中 + 材料真实）
    执行者: 人
    副作用: 标记推荐列；淘汰组不进池

  - 从: 推荐池
    到: 已推荐
    触发: 匹配到企业需求单 + 候选人知情同意
    执行者: 半自动
    副作用: 生成唯一凭证（编号 + 候选人邮箱 + 企业邮箱 + 时间戳）并发出

  - 从: 已推荐
    到: 推荐成功
    触发: 企业反馈入职
    执行者: 人
    副作用: 入 referrals.csv 台账；结果回灌评估模型

# ── 终止与复活 ─────────────────────────────────────────────────
终止:
  - 不推荐         # 不推荐 ≠ 淘汰，两条线分开走
  - 推荐成功

复活:
  - 无响应 → 已进群   # 迟到的扫码照样算（这条真在迁移表里，执行器推得动）

# ── 待定（卡点分析的产物，先留空，不编）────────────────────────
待定:
  - 无响应的天数 N
  - 二维码发出后的催促节奏
  - 文件夹漂移的自动补拉范围（现在靠人记得）
  - Spam 里有效投递的自动识别
